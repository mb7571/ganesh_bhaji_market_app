name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy APK with friendly name
        run: |
          mkdir -p apk-out
          cp app/build/outputs/apk/release/app-release.apk apk-out/GaneshBhajiMarket.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GaneshBhajiMarket-APK
          path: apk-out/GaneshBhajiMarket.apk
          retention-days: 90

      - name: Build status
        run: echo "✅ APK built successfully — download 'GaneshBhajiMarket-APK' from the run's Artifacts section"
