name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step needed: GitHub's ubuntu-latest runners ship
      # with the Android SDK preinstalled (ANDROID_HOME is preset).

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/ganesh-market.keystore
            echo "Decoded signing keystore from secret"
          else
            echo "KEYSTORE_BASE64 secret not set — APK will be signed with the debug key"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy APK with friendly name
        run: |
          mkdir -p apk-out
          cp app/build/outputs/apk/release/app-release.apk apk-out/GaneshBhajiMarket.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GaneshBhajiMarket-APK
          path: apk-out/GaneshBhajiMarket.apk
          retention-days: 90

      - name: Build status
        run: echo "✅ APK built successfully — download 'GaneshBhajiMarket-APK' from the run's Artifacts section"
