plugins {
    id 'com.android.application'
}

android {
    namespace 'in.ganeshmarket.app'
    compileSdk 34

    defaultConfig {
        applicationId "in.ganeshmarket.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with our keystore when present (CI / release machine),
            // otherwise fall back to the debug key so the APK stays installable.
            if (rootProject.file('keystore/ganesh-market.keystore').exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    signingConfigs {
        release {
            def ks = rootProject.file('keystore/ganesh-market.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword 'ganesh-market-2026'
                keyAlias 'ganesh-market'
                keyPassword 'ganesh-market-2026'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Build a debug APK too (easier to install while testing)
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
}
