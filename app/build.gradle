plugins {
    id 'com.android.application'
}

// On CI the signing keystore arrives as a base64 GitHub secret and is
// decoded to keystore/ganesh-market.keystore before the build runs.
def keystoreFile = rootProject.file('keystore/ganesh-market.keystore')
if (!keystoreFile.exists() && System.getenv('KEYSTORE_BASE64')) {
    keystoreFile.parentFile.mkdirs()
    keystoreFile.bytes = Base64.getDecoder().decode(System.getenv('KEYSTORE_BASE64'))
    println 'Decoded signing keystore from KEYSTORE_BASE64'
}

android {
    namespace 'in.ganeshmarket.app'
    compileSdk 34

    defaultConfig {
        applicationId "in.ganeshmarket.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'ganesh-market-2026'
                keyAlias System.getenv('KEYSTORE_ALIAS') ?: 'ganesh-market'
                keyPassword System.getenv('KEYSTORE_PASSWORD') ?: 'ganesh-market-2026'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with our keystore when present (CI / release machine),
            // otherwise fall back to the debug key so the APK stays installable.
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Build a debug APK too (easier to install while testing)
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
}
